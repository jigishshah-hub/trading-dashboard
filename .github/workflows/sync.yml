name: Sync Trade Sheet to Supabase

on:
  # Every 30 minutes, roughly NSE trading hours (9:15am-3:30pm IST),
  # Monday-Friday. Times are in UTC (IST is UTC+5:30), with a bit of
  # buffer either side. Adjust later if you want a different cadence.
  schedule:
    - cron: "*/30 3-10 * * 1-5"
  # Lets you trigger it manually from the Actions tab in GitHub, for
  # testing without waiting for the schedule.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python sync.py
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
