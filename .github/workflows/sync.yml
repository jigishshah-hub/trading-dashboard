name: "[DISABLED] Sync Trade Sheet to Supabase"

# DISABLED 2026-09-17: Supabase is now the single source of truth.
# Google Sheet sync retired — all trade data is managed directly in
# Supabase via Claude, Obsidian, or the dashboard.
# Keeping the file for reference; remove after confirming everything
# works without it.

on:
  # Schedule removed — no longer runs automatically.
  # Manual trigger preserved for emergency use only.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python sync.py
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
